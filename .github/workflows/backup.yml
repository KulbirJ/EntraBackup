name: Entra Backup

on:
  schedule:
    # 03:00 UTC daily. Cron on GitHub Actions is best-effort and can be delayed under
    # load, which is fine -- this is a daily snapshot, not a real-time monitor.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      categories:
        description: 'Comma-separated categories (blank = all)'
        required: false
        default: ''
      accept_shrink:
        description: 'Bypass the mass-deletion guard (only when a large drop is genuine)'
        type: boolean
        required: false
        default: false

permissions:
  id-token: write   # required for the OIDC federated credential exchange
  contents: write   # required to commit the snapshot back to the repo
  issues:   write   # required to raise an issue on security-relevant changes

concurrency:
  # Two overlapping runs would race on the same files and produce a corrupt commit.
  group: entra-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the diff against the previous run is available

      - name: Verify configuration
        shell: pwsh
        run: |
          # Format-checked, not just presence-checked. Pasting a placeholder complete
          # with its angle brackets is an easy mistake, and Entra's only response is a
          # bare HTTP 400 that gives no hint which value is malformed.
          $guid = '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

          foreach ($v in @(
            @{ Name = 'AZURE_TENANT_ID'; Value = '${{ vars.AZURE_TENANT_ID }}' }
            @{ Name = 'AZURE_CLIENT_ID'; Value = '${{ vars.AZURE_CLIENT_ID }}' }
          )) {
            if (-not $v.Value) {
              throw "Repository variable $($v.Name) is not set. See docs/SETUP.md."
            }
            if ($v.Value -notmatch $guid) {
              throw "Repository variable $($v.Name) is not a valid GUID: '$($v.Value)'. " +
                    "If it still has angle brackets around it, the placeholder was copied literally. " +
                    "Fix with: gh variable set $($v.Name) --body <the-guid-with-no-brackets>"
            }
          }
          Write-Host 'Configuration looks valid.'

      - name: Run offline regression tests
        shell: pwsh
        # Cheap, and it catches a broken normaliser before it can write a snapshot whose
        # diff is pure noise.
        run: ./tests/Test-Offline.ps1

      - name: Collect tenant snapshot
        id: collect
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          $backupArgs = @{ AuthMode = 'OIDC'; TenantId = $env:AZURE_TENANT_ID; ClientId = $env:AZURE_CLIENT_ID }

          $categoryInput = '${{ github.event.inputs.categories }}'
          if ($categoryInput) {
            $backupArgs['Category'] = $categoryInput.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          }
          if ('${{ github.event.inputs.accept_shrink }}' -eq 'true') {
            $backupArgs['AcceptShrink'] = $true
          }

          ./scripts/Invoke-EntraBackup.ps1 @backupArgs

          # Exit 2 is the mass-deletion guard, which is a deliberate refusal rather than a
          # crash. It is surfaced distinctly so the failure is not mistaken for a bug.
          if ($LASTEXITCODE -eq 2) {
            "## Backup blocked by the safety guard`n`nA collection shrank more than the configured limit, which usually means the run was throttled or lost a permission rather than that objects were really deleted. **Nothing was committed.**`n`nIf the drop is genuine, re-run this workflow with ``accept_shrink`` enabled." |
              Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 2
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage snapshot
        id: stage
        shell: pwsh
        run: |
          git config user.name  'entra-backup[bot]'
          git config user.email 'entra-backup[bot]@users.noreply.github.com'
          git add -A backup/

          $changed = git diff --cached --name-only
          if (-not $changed) {
            Write-Host 'Tenant unchanged since the previous run; nothing to commit.'
            "has_changes=false" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "has_changes=true" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Inspect for security-relevant changes
        id: risk
        if: steps.stage.outputs.has_changes == 'true'
        shell: pwsh
        run: ./scripts/Test-HighRiskChange.ps1 -Staged

      - name: Commit snapshot
        if: steps.stage.outputs.has_changes == 'true'
        shell: pwsh
        run: |
          $stat = git diff --cached --shortstat
          $counts = git diff --cached --name-status | ForEach-Object { $_.Substring(0,1) }
          $added    = @($counts | Where-Object { $_ -eq 'A' }).Count
          $modified = @($counts | Where-Object { $_ -eq 'M' }).Count
          $deleted  = @($counts | Where-Object { $_ -eq 'D' }).Count

          $date    = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $subject = "backup: $date (+$added ~$modified -$deleted)"

          $body = "Automated Entra tenant snapshot.`n`n$stat"
          if ('${{ steps.risk.outputs.high_risk }}' -eq 'true') {
            $body += "`n`nContains ${{ steps.risk.outputs.finding_count }} security-relevant change(s); see the linked issue."
          }

          git commit -m $subject -m $body
          git push

          "### $subject`n`n``````n$stat`n``````" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Raise an issue for security-relevant changes
        if: steps.stage.outputs.has_changes == 'true' && steps.risk.outputs.high_risk == 'true'
        # The snapshot is already committed and pushed by this point. Failing to raise a
        # notification must not mark the backup as failed -- the findings still reach the
        # run summary below either way.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $sha   = (git rev-parse --short HEAD).Trim()
          $body  = Get-Content ./high-risk-report.md -Raw
          $body += "`n`nCommit: ${{ github.server_url }}/${{ github.repository }}/commit/$sha"
          $title = "Security-relevant Entra changes on $date"

          # Labelling is attempted first but the label may not exist in a fresh repo, and
          # gh fails the whole call rather than just dropping the label.
          gh issue create --title $title --body $body --label 'entra-change' 2>&1 | Write-Host

          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'Labelled issue creation failed; retrying without a label.'
            gh issue create --title $title --body $body 2>&1 | Write-Host
          }

          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'Could not create an issue. Check that Settings > Actions > Workflow permissions allows read and write access. The findings are in the run summary regardless.'
            "> Note: an issue could not be created for these findings (insufficient token permission)." |
              Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Report no-change runs
        if: steps.stage.outputs.has_changes != 'true'
        shell: pwsh
        run: |
          'No configuration drift detected since the previous run.' |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
